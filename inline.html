<script id="final-interaction-engine">
(function(){
  function call(name,...args){
    try{
      if(typeof window[name]==='function') return window[name](...args);
    }catch(err){ console.error('ATLANT/ASMAN action '+name+' failed',err); alert('Ошибка: '+(err&&err.message?err.message:'не удалось выполнить действие')); }
  }
  document.addEventListener('click',function(e){
    const el=e.target && e.target.closest ? e.target.closest('button,[data-action],.employee-card,.month-link') : null;
    if(!el) return;

    /* Navigation is handled here independently of inline onclick. */
    if(el.matches('#nav button')){
      const id=el.id||'';
      if(id.indexOf('n_')===0){
        e.preventDefault(); e.stopImmediatePropagation();
        call('go',id.slice(2));
        return;
      }
    }

    const action=el.getAttribute('data-action');
    if(action){
      e.preventDefault(); e.stopImmediatePropagation();
      call(action,el.getAttribute('data-arg')||undefined);
      return;
    }

    if(el.classList.contains('payout-submit')) return;

    if(el.classList.contains('new-report-btn')){
      e.preventDefault(); e.stopImmediatePropagation();
      call('newReport',el.getAttribute('data-store')||undefined);
      return;
    }

    /* Critical owner actions that were reported as dead. */
    const txt=(el.textContent||'').trim().replace(/\s+/g,' ');
    if(/^\+?\s*Выдать зарплату/.test(txt) && !el.closest('#modal')){
      e.preventDefault(); e.stopImmediatePropagation(); call('newPayout'); return;
    }
    if(el.classList.contains('employee-card')){
      if(e.target.closest && e.target.closest('button,a,input,select,textarea')) return;
      const name=el.querySelector('.big')?.textContent?.trim();
      const store=el.querySelector('.muted')?.textContent?.split(" · ")[0]?.trim()||"";
      const y=el.getAttribute('data-year') || (window.salaryYear || new Date().getFullYear());
      if(name){e.preventDefault();e.stopImmediatePropagation();call('employeeYearDetail',name,Number(y),store);return;}
    }
  },true);

  /* Expose the modal helpers used by inline controls. */
  window.closeModal=window.closeModal||function(){const m=document.getElementById('modal');if(m)m.style.display='none'};
  window.showModal=window.showModal||function(t,b){const a=document.getElementById('modalTitle'),c=document.getElementById('modalBody'),m=document.getElementById('modal');if(a)a.textContent=t;if(c)c.innerHTML=b;if(m)m.style.display='grid'};
})();
</script>

// Photo handling: the file input itself is not stored in localStorage. We convert
// the selected image to a data URL first, then save that data URL in the report.
// This fixes the previous 1.20 bug where previewNewPhotoV13() called a missing
// compressImage() function, so r_preview.dataset.data stayed empty.
function compressImage(file, callback){
  if(!file || !file.type || !file.type.startsWith("image/")){
    alert("Выбери файл изображения (JPG, PNG, WEBP и т.п.)");
    return;
  }
  const reader=new FileReader();
  reader.onerror=()=>alert("Не удалось прочитать фотографию. Попробуй выбрать её ещё раз.");
  reader.onload=()=>{
    const src=reader.result;
    const img=new Image();
    img.onload=()=>{
      try{
        const maxSide=1800;
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
        const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        if(!ctx){ callback(src); return; }
        ctx.drawImage(img,0,0,w,h);
        callback(canvas.toDataURL("image/jpeg",0.82));
      }catch(err){
        console.warn("ATLANT/ASMAN: не удалось сжать фото, сохраняем оригинал",err);
        callback(src);
      }
    };
    img.onerror=()=>callback(src);
    img.src=src;
  };
  reader.readAsDataURL(file);
}

}

}

  const rates=(Array.isArray(db.rates)?db.rates:[]).map(x=>({employee:x.employee,store:x.store,date:x.date,pct:Number(x.pct)||0,fixed:Number(x.fixed)||0}));

  const payouts=(Array.isArray(db.payouts)?db.payouts:[]).filter(x=>!x.voided).map(x=>({employee:x.employee,store:x.store,date:x.date,amount:Number(x.amount)||0,note:x.note||""}));
  const otherRevenue=(Array.isArray(db.otherRevenue)?db.otherRevenue:[]).map(x=>({employee:x.employee,store:x.store,date:x.date,amount:Number(x.amount)||0,note:x.note||""}));

const aiAsk=async(question,quickMode=false)=>{

  if(box)box.innerHTML=aiMessages.map(m=>`<div class="ai-msg ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join("");
  if(box)box.scrollTop=box.scrollHeight;

  const btn=document.getElementById("aiSend"); if(btn)btn.disabled=true;

    if(box)box.innerHTML=aiMessages.map(m=>`<div class="ai-msg ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join("");
    if(box)box.scrollTop=box.scrollHeight;

<script id="final-button-handler">
(function(){
  // Centralized safety handler for dynamically created controls.
  // v1.14 had the visual .new-report-btn but no action attached to it.
  document.addEventListener("click", function(e){
    const b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(!b) return;
    b.style.pointerEvents = "auto";
    if(b.classList.contains("new-report-btn")){
      e.preventDefault();
      e.stopPropagation();
      try{
        const store = b.getAttribute("data-store") || undefined;
        if(typeof window.newReport === "function") window.newReport(store);
        else console.error("ATLANT/ASMAN: newReport is not available");
      }catch(err){
        console.error("ATLANT/ASMAN: ошибка открытия нового отчёта", err);
        alert("Не удалось открыть форму нового отчёта. Обновите страницу.");
      }
    }
  }, false);
})();
</script>
